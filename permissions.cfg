##############################################################################
#  vMenu - permissions.cfg
#
#  How to use:
#    Add this line to your server.cfg, BEFORE "ensure vMenu":
#        exec @vMenu/permissions.cfg
#
#  How permissions work:
#    - Every option is an ACE named vMenu.<Category>.<Option>.
#    - vMenu.<Category>.Menu  lets a player open that menu.
#    - vMenu.<Category>.All   gives every option inside that menu.
#    - vMenu.Everything       gives every permission in vMenu.
#    - Changed something while the server runs? Use "vmenuserver reload"
#      in the server console to resend permissions to everyone online.
##############################################################################


##############################################################################
#  1. SETTINGS
#  setr = also sent to players (needed for client options)
#  set  = server only (keep webhooks on "set" so players can't see the URLs)
##############################################################################

# Use the permissions below. If false, every player gets every option
# except the admin ones (kick, ban, kill, identifiers, blips, dev tools).
setr vmenu_use_permissions true

# Only staff (vMenu.Staff or vMenu.Everything) can open the menu at all.
setr vmenu_menu_staff_only false

# Default keys (players can still change them in their FiveM key bindings).
setr vmenu_menu_toggle_key "M"
setr vmenu_noclip_toggle_key "F2"

# Default language for new players: en, ar, es, pt, de
setr vmenu_language "en"

# Default menu theme for new players: default, dark
setr vmenu_theme "default"

# Custom banner: a file inside the vMenu folder or an image/GIF URL.
# Leave empty to use assets/banner.png|jpg|gif if present, otherwise the stock banner.
setr vmenu_banner ""

# Online Players menu only lists players near you (lighter on big servers).
setr vmenu_online_players_nearby_only false

# Let vMenu handle invisibility every frame (needed if other scripts reset it).
setr vmenu_handle_invisibility true

# Leave the session when opening the Rockstar Editor.
setr vmenu_quit_session_in_rockstar_editor false

# Extra line shown in the About menu.
setr vmenu_server_info_message ""
setr vmenu_server_info_website_url ""

# Discord webhooks for logs (leave empty to disable). Server only!
set vmenu_webhook_players ""
set vmenu_webhook_bans ""
set vmenu_webhook_vehicles ""
set vmenu_webhook_weapons ""
set vmenu_webhook_teleport ""
set vmenu_webhook_time ""
set vmenu_webhook_weather ""
set vmenu_webhook_misc ""


##############################################################################
#  2. GROUPS
#  Edit these to match your server. A player can be in several groups.
##############################################################################

# --- Admins: everything -----------------------------------------------------
add_ace group.admin vMenu.Everything allow

# --- Moderators: player management, noclip, world control ------------------
add_ace group.moderator vMenu.Staff allow
add_ace group.moderator vMenu.NoClip allow
add_ace group.moderator vMenu.DontKickMe allow
add_ace group.moderator vMenu.DontBanMe allow
add_ace group.moderator vMenu.OnlinePlayers.All allow
add_ace group.moderator vMenu.PlayerOptions.All allow
add_ace group.moderator vMenu.VehicleOptions.All allow
add_ace group.moderator vMenu.VehicleSpawner.All allow
add_ace group.moderator vMenu.TimeOptions.All allow
add_ace group.moderator vMenu.WeatherOptions.All allow
add_ace group.moderator vMenu.MiscSettings.All allow
add_ace group.moderator vMenu.MiscSettings.PlayerBlips allow
add_ace group.moderator vMenu.MiscSettings.OverheadNames allow

# --- Everyone (all players are in builtin.everyone automatically) ----------
# Misc Settings (language, theme, menu position, HUD, keybinds) is open to
# everyone; its teleport/tool options still need their own ACE below.
add_ace builtin.everyone vMenu.PlayerAppearance.Menu allow
add_ace builtin.everyone vMenu.PlayerAppearance.Customize allow
add_ace builtin.everyone vMenu.PlayerAppearance.SpawnSaved allow
add_ace builtin.everyone vMenu.MpPedCustomization.All allow
add_ace builtin.everyone vMenu.VoiceChat.Menu allow


##############################################################################
#  3. PLAYERS
#  Put players in a group by their identifier (license, discord, fivem...).
##############################################################################

# add_principal identifier.license:xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx group.admin
# add_principal identifier.discord:000000000000000000 group.moderator


##############################################################################
#  4. FULL PERMISSION LIST (reference)
